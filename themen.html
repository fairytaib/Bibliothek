<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Themen — ARCHIV</title>
  <meta name="description" content="Alle Themen der Bibliothek – mit passenden Videos, Büchern und Gelehrten." />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#0a0f1a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Archiv · HDI-Bibliothek" />
  <meta property="og:locale" content="de_DE" />
  <meta property="og:title" content="Themen – Archiv · HDI-Bibliothek" />
  <meta property="og:description" content="Alle Themen der Bibliothek, von Quran und Sirah bis Ehe &amp; Familie – mit passenden Videos und Büchern." />
  <meta name="twitter:card" content="summary" />
</head>

<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">
        <span class="mark">A</span>
        Archiv <small>HDI-Bibliothek</small>
      </a>
      <nav class="nav-links">
        <a href="index.html">Gelehrte</a>
        <a href="themen.html" class="active">Themen</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <p class="hero-eyebrow">Themen</p>
      <h1>Stöbere nach Thema</h1>
      <p>Jedes Thema führt zu allen passenden Videos, Büchern und Gelehrten – egal, bei wem sie eingetragen sind.</p>

      <div class="search-panel">
        <div class="search-row">
          <div class="search-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="themen-search" class="search-field" placeholder="Thema suchen, z. B. Gebet, Jenseits, Ehe" autocomplete="off" aria-label="Thema suchen" />
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="results-section">
    <div class="container">
      <div class="results-meta">
        <span aria-live="polite"><strong id="themen-count">0</strong> Themen gefunden</span>
      </div>
      <div id="themen-groups">
        <!-- Themen-Gruppen werden von app.js gerendert -->
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      Archiv · Unsere muslimische Bibliothek
    </div>
  </footer>

  <script src="app.js"></script>
</body>

</html>
