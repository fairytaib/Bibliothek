<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARCHIV — HDI-Bibliothekssystem</title>
<meta name="description" content="Durchsuche Professoren nach Sprache, Spezialisierung und Thema — mit Videos und Buchempfehlungen." />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="mark">A</span>
      Archiv <small>HDI-Bibliothek</small>
    </a>
    <nav class="nav-links">
      <a href="index.html" class="active">Katalog</a>
      <a href="themen.html">Themen</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <p class="hero-eyebrow">Gelehrte</p>
    <h1>Finde die richtige Stimme für dein Thema</h1>
    <p>Suche Gelehrte nach Name, Sprache, Spezialisierung oder Thema und gelange direkt zu ihren Video- und Buchempfehlungen.</p>

    <div class="search-panel">
      <div class="search-row">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="Suche nach Name, Sprache, Thema…" autocomplete="off" />
        </div>
      </div>
      <div class="filters-row">
        <select id="filter-lang" class="filter-select">
          <option value="">Alle Sprachen</option>
        </select>
        <select id="filter-spez" class="filter-select">
          <option value="">Alle Spezialisierungen</option>
        </select>
        <button type="button" id="clear-filters" class="clear-filters">Filter zurücksetzen</button>
      </div>
    </div>
  </div>
</section>

<section class="results-section">
  <div class="container">
    <div class="results-meta">
      <span><strong id="result-count">0</strong> Profile gefunden</span>
    </div>
    <div class="card-grid" id="card-grid">
      <!-- Karten werden dynamisch von app.js gerendert -->
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    Archiv · Ein statisches Bibliothekssystem ohne Backend
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
